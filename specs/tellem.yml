    - id: tellem.report/v1
      name: report envelope
      file: stdout of any tellem <command> --json
      root: home
      encoding: >-
        one JSON object on one line (JSON.generate) plus newline; without --json the command prints text
        and failures go to stderr
      written_by:
      - lib/tellem/cli.rb
      - lib/tellem/record/formats.rb
      read_by: []
      bounds:
      - constant: EXIT_CODES
        value: ok 0, operational_failure 1, usage 2, confirmation_required 3, busy 4, capability_unavailable
          5
        applies_to: process exit status
      fields:
      - name: schema
        type: string
        required: true
        enum:
        - tellem.report/v1
      - name: command
        type: string
        required: true
        description: The command word as typed (first non-flag argument), e.g. sync, prune.
      - name: data
        type:
        - object
        - array
        - string
        - 'null'
        required: true
        description: Command result; always present; null when the command failed with an error and has
          no plan to show.
      - name: error
        type: object
        required: false
        description: Present only on failure or confirmation required.
        item_fields:
        - name: code
          type: string
          required: true
          enum:
          - operational_failure
          - usage
          - confirmation_required
          - busy
          - capability_unavailable
          description: InvalidInput, InputTooLarge, InvalidRecord and SymlinkRefused report operational_failure.
        - name: message
          type: string
          required: true
        - name: next_command
          type: string
          required: false
          description: A command that moves forward; omitted when none.
        - name: detail
          type: object
          required: false
          description: 'Structured context such as {cause: ...}; omitted when none.'
      kinds:
      - name: success
        fields:
        - exit 0
        - >-
          data is the command's body; commands that read reports add {scopes: [{scope_id, root, kind (repository,
          user), gone}], derive: {...}} first
      - name: confirmation required
        fields:
        - >-
          exit 3, printed with --json as the envelope with data = the plan and error {code confirmation_required,
          message, next_command (the command with --confirm PLAN_ID)}
        - >-
          used by prune, forget, cutover apply and rollback, import, specstory remove; without --json
          the plan text goes to stdout and message and next to stderr
      - name: failure
        fields:
        - data null, error set; exit 1, 2, 4 or 5 from the code
        - 'without --json: stderr ''tellem: <message>'', usage text for exit 2, ''next: <next_command>''
          otherwise'
      - name: gate
        fields:
        - views rebuild --check exits 1 with data (no error) when a view would change
      invariants:
      - >-
        Exit 2 is also returned, with no JSON, for a missing command word (usage to stderr); help, --help
        and -h print the usage and exit 0; an unknown command is a usage error with next_command 'tellem
        --help'.
      - >-
        Deriver status values (data.scopes[].status of sync, data.status of derive): ran, dirty (lock
        held and no wait requested), waited (lock held, then freed within WAIT_S 10 s), busy (still held;
        raised as error busy, exit 4), disabled (features.derive off).
      - >-
        Report-time refresh status values (data.derive.status of read reports): ok (with scopes count),
        failed (with scopes and failures [{root, error_class}]), timeout (with wait_s 10), disabled (TELLEM_DERIVE_DISABLED=1),
        unavailable (no deriver), skipped (--no-derive). With --strict a timeout is raised as error busy.
      - >-
        Deriver summary keys: scope_root, scope_id, status, passes, sessions, observations_added, gaps_added,
        duration_ms, phase_ms (phases config raw places workspace transcripts alignment remote persona
        lifecycle tasks pointers registry projections mirror events, milliseconds each).
      - Error object keys with a nil value are omitted.
      - >-
        A command refused access to a file or directory (EACCES or EPERM) is a failure with code
        operational_failure (exit 1): message 'permission denied: PATH', next_command 'chmod u+rwX PATH' with
        PATH shell-escaped, and detail {path}. PATH is the first directory on the way that cannot be searched,
        else the file or directory that was refused. When the system message carries no path, the message is
        'permission denied', next_command 'tellem health --all', and detail {message}. An unreadable sessions
        directory is such a failure for every report that reads derived records and for a view rebuild, never
        an empty result. tellem search, transcript, and shadow still skip what they cannot read.
      - >-
        tellem health does not fail that way for the record or the hook gap file. Each scope's health carries
        unreadable (sorted paths, empty when everything was read), and its other figures are computed from what
        was read; when the scope's .tellem directory cannot be read, every other figure of that scope is null.
        hook_gaps carries unreadable the same way, and its total and torn_lines are null when the file cannot be
        read. The text form adds an unreadable line per path.
    - id: mirror schema
      name: SQLite and PostgreSQL mirror tables
      file: >-
        SQLite: .tellem/mirror.sqlite3 (scope) or <state_dir>/mirror.sqlite3 (user), with -wal -shm -journal
        sidecars; PostgreSQL: the database named by the secret backend.secret, default schema, no prefix.
        DDL in db/sqlite/NNN_*.sql and db/postgres/NNN_*.sql
      root: scope | state
      encoding: >-
        relational; SQLite file mode 0600 created with O_EXCL|O_NOFOLLOW, page_size 65536, journal_mode
        WAL; PostgreSQL over TLS (sslmode require unless the host is loopback) with statement_timeout
        15000 ms
      written_by:
      - lib/tellem/backends/mirror/writes.rb
      - lib/tellem/backends/mirror/schema.rb
      - lib/tellem/backends/mirror/rollup.rb
      - lib/tellem/backends/feed.rb
      read_by:
      - lib/tellem/backends/reports.rb
      - lib/tellem/backends/mirror/maintenance.rb
      - lib/tellem/reports/prune.rb
      bounds:
      - constant: Ports::Backend::SYNC_BATCH
        value: 1000
        applies_to: records per write batch
      - constant: Mirror::ROLLUP_SLICE
        value: 400
        applies_to: rollup rows per insert
      - constant: Rows::GROUP_KEY_HEX
        value: 24
        applies_to: group_key length
      - constant: Rows::COST_UNITS
        value: 1000000000
        applies_to: cost_usd is stored as integer billionths of a dollar
      - constant: Guard::RATE_PER_SECOND
        value: 20.0
        applies_to: limiter rate; burst BURST 40
      - constant: Guard::MAX_ATTEMPTS
        value: 3
        applies_to: attempts per guarded call; backoff base 0.25 s, cap 4.0 s, full jitter
      - constant: Guard::BREAKER_THRESHOLD
        value: 5
        applies_to: consecutive failures that open the breaker; open for BREAKER_OPEN_S 60, probe lease
          PROBE_LEASE_S 30
      - constant: Guard::CONNECT_TIMEOUT_S
        value: 3
        applies_to: PostgreSQL connect timeout; SQLite busy timeout BUSY_TIMEOUT_MS 5000
      kinds:
      - name: tellem_meta
        description: >-
          Key-value table, primary key key. Keys: schema_version (decimal string of the newest applied
          migration), created_at (rfc3339 seconds), last_sync_at, last_sync_at:<scope_id> (rfc3339 seconds).
        fields:
        - name: key
          type: string
          required: true
          description: TEXT PRIMARY KEY
        - name: value
          type: string
          required: false
          description: TEXT
      - name: scopes
        description: One row per fed scope; upserted at every feed.
        fields:
        - name: scope_id
          type: string
          required: true
          description: TEXT PRIMARY KEY
        - name: root
          type: string
          required: true
          description: TEXT NOT NULL
        - name: kind
          type: string
          required: true
          description: TEXT NOT NULL; repository or user
      - name: observations
        description: >-
          One row per derived record, primary key (scope_id, id). SQLite body TEXT, PostgreSQL body JSONB.
          Indexes observations_session_kind (session_key, kind), observations_ts (ts), observations_supersedes
          (scope_id, supersedes) WHERE supersedes IS NOT NULL (002).
        fields:
        - name: scope_id
          type: string
          required: true
          description: TEXT NOT NULL
        - name: id
          type: string
          required: true
          description: TEXT NOT NULL; the 32 hex derived id
        - name: session_key
          type: string
          required: false
          description: TEXT
        - name: agent_key
          type: string
          required: false
          description: TEXT
        - name: kind
          type: string
          required: true
          description: TEXT NOT NULL
        - name: ts
          type: string
          required: true
          description: TEXT NOT NULL; rfc3339 ms
        - name: schema
          type: string
          required: true
          description: TEXT NOT NULL, quoted column "schema"; tellem.derived/v1
        - name: supersedes
          type: string
          required: false
          description: TEXT
        - name: body
          type: object
          required: true
          description: SQLite TEXT NOT NULL holding JSON; PostgreSQL JSONB NOT NULL
      - name: usage
        description: >-
          One row per request id of kind usage, primary key (scope_id, id); the earliest record by [ts,
          session_key] wins across scopes. Indexes usage_id (id), usage_request (scope_id, request_key),
          usage_shared (scope_id, id) WHERE shared, usage_unshared_ts (scope_id, ts) WHERE NOT shared
          AND NOT superseded (002; 001 indexes usage_model, usage_day, usage_repository are dropped by
          002).
        fields:
        - name: scope_id
          type: string
          required: true
          description: TEXT NOT NULL
        - name: id
          type: string
          required: true
          description: TEXT NOT NULL
        - name: request_key
          type: string
          required: false
          description: TEXT
        - name: session_key
          type: string
          required: false
          description: TEXT
        - name: agent_key
          type: string
          required: false
          description: TEXT
        - name: subagent_type
          type: string
          required: false
          description: TEXT
        - name: model
          type: string
          required: false
          description: TEXT
        - name: effort
          type: string
          required: false
          description: TEXT; filled from usage_detail with COALESCE
        - name: persona
          type: string
          required: false
          description: TEXT; holds the body's persona_key
        - name: repository_id
          type: string
          required: false
          description: TEXT
        - name: place_id
          type: string
          required: false
          description: TEXT
        - name: day
          type: string
          required: false
          description: TEXT; first 10 characters of ts (UTC date)
        - name: input_tokens
          type: integer
          required: false
          description: SQLite INTEGER, PostgreSQL BIGINT; null when not reported
        - name: output_tokens
          type: integer
          required: false
          description: as input_tokens
        - name: cache_read_input_tokens
          type: integer
          required: false
          description: as input_tokens
        - name: cache_creation_input_tokens
          type: integer
          required: false
          description: as input_tokens
        - name: reasoning_tokens
          type: integer
          required: false
          description: as input_tokens
        - name: total_tokens
          type: integer
          required: false
          description: as input_tokens
        - name: superseded
          type: boolean
          required: true
          description: >-
            SQLite INTEGER NOT NULL DEFAULT 0, PostgreSQL BOOLEAN NOT NULL DEFAULT FALSE; true when a
            later observation names this id in supersedes
        - name: ts
          type: string
          required: false
          description: TEXT, added by 002 and backfilled from observations
        - name: shared
          type: boolean
          required: true
          description: added by 002, default false; true when the same id also exists under another scope_id
        - name: cost_usd
          type: integer
          required: false
          description: added by 002, INTEGER or BIGINT; billionths of a dollar from the matching usage_detail
            observation
      - name: places
        description: One row per place record, primary key place_id, upserted.
        fields:
        - name: place_id
          type: string
          required: true
          description: TEXT PRIMARY KEY
        - name: kind
          type: string
          required: false
          description: TEXT
        - name: host
          type: string
          required: false
          description: TEXT
        - name: real_path
          type: string
          required: false
          description: TEXT
        - name: repository_id
          type: string
          required: false
          description: TEXT
      - name: sync_cursors
        description: Feed cursors, primary key (scope_id, file).
        fields:
        - name: scope_id
          type: string
          required: true
          description: TEXT NOT NULL
        - name: file
          type: string
          required: true
          description: TEXT NOT NULL; sessions/<session_key>/derived.jsonl relative to .tellem
        - name: inode
          type: integer
          required: false
          description: SQLite INTEGER, PostgreSQL BIGINT
        - name: offset
          type: integer
          required: false
          description: quoted column "offset"; byte offset of the next unread line
      - name: usage_rollup
        description: >-
          Added by 002. Hourly rollup of unshared, unsuperseded usage rows, primary key (scope_id, hour,
          group_key); SQLite WITHOUT ROWID. Rebuilt per dirty bucket after every write transaction.
        fields:
        - name: scope_id
          type: string
          required: true
          description: TEXT NOT NULL
        - name: hour
          type: string
          required: true
          description: TEXT NOT NULL; first 13 characters of ts, YYYY-MM-DDTHH
        - name: group_key
          type: string
          required: true
          description: >-
            TEXT NOT NULL; first 24 hex of sha256 of canonical JSON of the nine dimension values in order
            agent_key, session_key, model, effort, persona, repository_id, place_id, day, subagent_type
        - name: agent_key
          type: string
          required: false
          description: TEXT
        - name: session_key
          type: string
          required: false
          description: TEXT
        - name: model
          type: string
          required: false
          description: TEXT
        - name: effort
          type: string
          required: false
          description: TEXT
        - name: persona
          type: string
          required: false
          description: TEXT
        - name: repository_id
          type: string
          required: false
          description: TEXT
        - name: place_id
          type: string
          required: false
          description: TEXT
        - name: day
          type: string
          required: false
          description: TEXT
        - name: subagent_type
          type: string
          required: false
          description: TEXT
        - name: requests
          type: integer
          required: true
          description: NOT NULL; count of usage rows
        - name: >-
            input_tokens, output_tokens, cache_read_input_tokens, cache_creation_input_tokens, reasoning_tokens,
            total_tokens
          type: integer
          required: true
          description: NOT NULL sums, null counted as 0
        - name: >-
            input_tokens_n, output_tokens_n, cache_read_input_tokens_n, cache_creation_input_tokens_n,
            reasoning_tokens_n, total_tokens_n
          type: integer
          required: true
          description: NOT NULL counts of non-null values
        - name: cost_usd
          type: integer
          required: true
          description: NOT NULL sum in billionths of a dollar
        - name: cost_usd_n
          type: integer
          required: true
          description: NOT NULL count of non-null cost_usd
      - name: usage_dirty
        description: >-
          Added by 002. Buckets to recompute, primary key (scope_id, hour); filled by triggers usage_dirty_insert,
          usage_dirty_update, usage_dirty_delete on usage; SQLite WITHOUT ROWID. PostgreSQL also defines
          the functions tellem_usage_dirty_new, tellem_usage_dirty_old and tellem_usage_dirty_both.
        fields:
        - name: scope_id
          type: string
          required: true
          description: TEXT NOT NULL
        - name: hour
          type: string
          required: true
          description: TEXT NOT NULL
      invariants:
      - >-
        Migration files are named NNN_<change>.sql (three digits, matched by [0-9][0-9][0-9]_*.sql), applied
        in ascending order inside one locked transaction, and tellem_meta.schema_version records the newest
        applied number; migration 2 recomputes the rollup. PostgreSQL migrations take advisory lock 7164823391,
        usage writes take 7164823392.
      - >-
        schema_state: behind (stored < newest shipped; migrated on first use), current, ahead (stored
        > shipped; reports use files, the feed pauses, the breaker is untouched, status says why).
      - >-
        Differences between dialects: SQLite stores booleans as INTEGER 0/1 and counters as INTEGER, PostgreSQL
        as BOOLEAN and BIGINT; observations.body is TEXT versus JSONB.
      - >-
        Tables are created with IF NOT EXISTS; the full table list is sync_cursors, places, usage_dirty,
        usage_rollup, usage, observations, scopes, tellem_meta (Rows::TABLES), the set a drop removes.
      - >-
        Rows are inserted ON CONFLICT DO NOTHING (observations, usage first insert), with updates for
        scopes, places, sync_cursors and an earlier duplicate usage record.
    - id: backend-breaker.json
      name: mirror circuit breaker state
      file: "<state_dir>/backend-breaker.json"
      root: state
      encoding: >-
        json, one compact object (JSON.generate plus newline), updated in place under flock LOCK_EX with
        truncate and fsync; mode 0600
      written_by:
      - lib/tellem/backends/guard.rb
      read_by:
      - lib/tellem/backends/guard.rb
      - lib/tellem/backends/mirror/maintenance.rb
      fields:
      - name: "<guard_key>"
        type: object
        required: true
        description: >-
          Key is '<kind>|<location>' (sqlite path, or postgres://host:port/dbname, or postgres://secret:<name>).
          Each value has the fields below.
      - name: failures
        type: integer
        required: true
        description: Consecutive failure count.
      - name: opened_at
        type:
        - number
        - 'null'
        required: true
        description: Epoch seconds as a float when the breaker opened; null when closed.
      - name: probe_until
        type:
        - number
        - 'null'
        required: true
        description: Epoch seconds of the half-open probe lease; null when none.
      - name: last_sync_at
        type:
        - string
        - 'null'
        required: true
        format: rfc3339 UTC seconds, Z suffix
      - name: last_error
        type:
        - string
        - 'null'
        required: true
        description: Error class name of the last failure.
      invariants:
      - >-
        Breaker state is closed, open (within 60 s of opened_at) or half_open (after), or disabled when
        TELLEM_BACKEND_DISABLED=1.
    - id: versioning
      name: schema id and format versioning rules
      file: lib/tellem/record/schemas.rb, lib/tellem/record/formats.rb, db/<backend>/NNN_*.sql
      root: home
      encoding: rules, no file
      written_by: []
      read_by: []
      fields:
      - name: schema id
        type: string
        required: true
        format: tellem.<name>/v<major>
        description: >-
          Record formats are versioned by schema name; a new major format is a new schema name read alongside
          the old.
      invariants:
      - >-
        Readers select lines by exact schema equality (for example schema == tellem.entry/v1, tellem.body-parity/v1,
        tellem.retention/v1) and skip lines of any other schema; a derived line is valid only when schema
        is tellem.derived/v1, its kind is known and its id recomputes.
      - >-
        Schemas::ALL lists only SCOPE, RAW, DERIVED, POINTER, HOME, PRUNE, REPORT. The schemas tellem.entry/v1,
        tellem.forget/v1, tellem.retention/v1, tellem.authority/v1, tellem.body-parity/v1, tellem.cutover/v1
        and tellem.discovery/v1 are constants in their own modules and are not in that list.
      - >-
        Mirror schemas are versioned SQL files per backend, applied in order and recorded in tellem_meta.schema_version;
        a file already shipped is edited in place only before release (002 was edited in place).
      - >-
        Every RFC 3339 timestamp is UTC with a Z suffix. Record::FS.rfc3339 writes whole seconds (receipts,
        plans, state files, prune, forget, retention); Record::FS.rfc3339_ms writes three fractional digits
        (raw ts, derived ts, entry at).
    - id: tellem.specstory-removal/v1
      file: specstory/removal.jsonl
      root: state
      encoding: jsonl, append-only receipts, written through Retention::Remove.write_line
      written_by:
      - lib/tellem/specstory/state.rb
      - lib/tellem/specstory/remove.rb
      read_by:
      - lib/tellem/specstory/state.rb
      - lib/tellem/specstory/remove.rb
      - lib/tellem/specstory/prevent.rb
      fields:
      - name: schema
        type: string
        required: true
        enum:
        - tellem.specstory-removal/v1
        description: Schema id.
      - name: at
        type: string
        required: true
        format: rfc3339 UTC, seconds precision, Z suffix
        description: When the receipt was written.
      - name: phase
        type: string
        required: true
        enum:
        - plan
        - pending
        - applied
        - complete
        description: Step of the removal this receipt records.
      - name: plan_id
        type: string
        required: true
        description: Removal plan id the receipt belongs to.
      - name: source
        type: string
        required: false
        enum:
        - remove
        - drift
        description: 'plan and complete: a confirmed remove, or the drift sweep that re-removes reappeared
          files.'
      - name: items
        type: array
        items: object
        required: false
        description: 'plan: every item the plan will remove, in order.'
      - name: state
        type: object
        required: false
        description: 'plan with source remove: the removal state payload later written to removal.json.'
      - name: index
        type: integer
        required: false
        description: 'pending and applied: position of the item in the plan''s items.'
      - name: receipt_id
        type: string
        required: false
        description: >-
          pending and applied: id pairing an item's pending and applied receipts, so an interrupted removal
          resumes.
      - name: outcome
        type: string
        required: false
        enum:
        - removed
        - kept
        description: 'applied: what happened to the item.'
      - name: cause
        type:
        - string
        - 'null'
        required: false
        description: >-
          applied: why an item was kept (for example link_changed, base_unavailable), or absent when it
          was already gone; null for a plain removal.
      - name: removed
        type: integer
        required: false
        description: 'complete: count of items removed.'
      - name: kept
        type: integer
        required: false
        description: 'complete: count of items kept.'
      - name: class
        type: string
        required: false
        description: >-
          pending and applied: Class of the removed item as the plan named it (for example wrapper, repo,
          home, history).
      - name: kind
        type: string
        required: false
        enum:
        - file
        - dir
        - wrapper
        description: 'pending and applied: What the item is.'
      - name: path
        type: string
        required: false
        description: 'pending and applied: Display path of the item.'
      - name: bytes
        type: integer
        required: false
        description: 'pending and applied: Size of the item in bytes; 0 for a directory.'
      - name: sha256
        type: string
        required: false
        format: lowercase hex, 64 characters
        description: 'pending and applied: Digest of the file when it was planned.'
      invariants:
      - >-
        Every item gets a pending receipt before it is touched and an applied receipt after, so a crash
        between them is resumed, not repeated blindly.
      - >-
        Removal runs under specstory/removal.lock (flock, non-blocking); a held lock refuses with Busy
        and removes nothing.
      - A file whose linking path no longer resolves to the planned base is kept with cause link_changed.
    - id: tellem.specstory-removal-state/v1
      file: specstory/removal.json
      root: state
      encoding: json, one pretty-printed document, atomic replace
      written_by:
      - lib/tellem/specstory/state.rb
      - lib/tellem/specstory/remove.rb
      read_by:
      - lib/tellem/specstory/state.rb
      - lib/tellem/specstory/prevent.rb
      - lib/tellem/specstory/remove.rb
      fields:
      - name: schema
        type: string
        required: true
        enum:
        - tellem.specstory-removal-state/v1
        description: Schema id.
      - name: plan_id
        type: string
        required: true
        description: The applied removal plan.
      - name: applied_at
        type: string
        required: true
        format: rfc3339 UTC, seconds precision, Z suffix
        description: When the removal started.
      - name: finished_at
        type: string
        required: true
        format: rfc3339 UTC, seconds precision, Z suffix
        description: When the removal finished.
      - name: history
        type: string
        required: true
        enum:
        - keep
        - remove
        description: Whether .specstory/history was kept or removed.
      - name: prevent
        type: boolean
        required: true
        description: Whether tellem keeps SpecStory from writing again (the drift sweep and startup wrappers).
      - name: link_targets
        type: array
        items: string
        required: true
        description: Symlink targets the operator named, which the plan may follow.
      - name: wrappers
        type: array
        items: object
        required: true
        description: Named startup wrappers the plan removed.
      - name: roots
        type: array
        items: string
        required: true
        description: Repository roots whose .specstory content the plan covered.
      - name: home
        type: boolean
        required: true
        description: Whether the home-folder .specstory state was in the plan.
      - name: writer
        type:
        - string
        - 'null'
        required: true
        description: The specstory_writer setting pinned at the end of the removal.
      invariants:
      - Written once per completed removal; the receipts in removal.jsonl are the record of each step.
    - id: tellem.dashboard/v1
      name: dashboard dataset and page
      file: "<state_dir>/dashboard/dashboard.html and dashboard-share.html; with --json, data of the report envelope and no file"
      root: data
      encoding: >-
        One self-contained HTML document, atomic replace, mode 0600, directory 0700, never through a
        symlink. The dataset is JSON in a script element of type application/json with every less-than
        sign and the line and paragraph separators escaped, under a content security policy that allows
        no connection.
      written_by:
      - lib/tellem/dashboard/writer.rb
      - lib/tellem/dashboard/page.rb
      - lib/tellem/dashboard/dataset.rb
      read_by:
      - lib/tellem/dashboard/web/
      command: tellem dashboard [--share] [--no-open] [--json]
      fields:
      - name: "schema"
        type: string
        required: true
        description: >-
          tellem.dashboard/v1.
      - name: "tellem_version"
        type: string
        required: true
        description: >-
          The tellem version that wrote the document.
      - name: "as_of"
        type: string
        required: true
        description: >-
          UTC time the document describes; records at or after it are excluded.
      - name: "since"
        type: string
        required: true
        description: >-
          UTC hour 719 hours before the hour that holds as_of; hour 0 of every hour index.
      - name: "hours"
        type: integer
        required: true
        description: >-
          720.
      - name: "share"
        type: boolean
        required: true
        description: >-
          True for the share copy, where label, home, and repository path are null and repositories are named repository N in repos order.
      - name: "counters"
        type: array
        required: true
        description: >-
          Counter names in the order usage rows carry them.
      - name: "dict"
        type: object
        required: true
        description: >-
          Sorted string lists models, agent_types, efforts, personas, tools, harnesses, and causes; rows refer to them by index, null when unknown.
      - name: "repos"
        type: array
        required: true
        description: >-
          One object per live covered scope: name, path, lag_seconds (null when no raw record in the window was read), last_derive_at, newest_raw_at, dirty, torn_raw, torn_derived, and status ok, lagging (over 900 s, or never derived with raw records), or unreadable (every figure null).
      - name: "gone_repos"
        type: integer
        required: true
        description: >-
          Covered scopes that no longer exist.
      - name: "sessions"
        type: array
        required: true
        description: >-
          Sessions with a derived record in the window, ordered by repository index then key: key, repo, harness, label, started, ended, first, last, open (the main agent's open flag), home, active_hours (inclusive hour ranges holding any record), agents, calls, failures. Instants are epoch seconds. A session key present in two scopes appears twice.
      - name: "sessions[].agents"
        type: array
        required: true
        description: >-
          Depth-first, roots first, siblings by start then key: key, parent (index or null), type, model, effort, isolation, started, ended, open, wall, active (the spans definition when time.active is both), waiting, spans ([from, to] pairs).
      - name: "sessions[].calls"
        type: array
        required: true
        description: >-
          [agent, tool, calls, failed, total_ms, timed_calls] over answered tool calls in the window; total_ms null when none was timed.
      - name: "sessions[].failures"
        type: array
        required: true
        description: >-
          [at, agent, tool, duration_ms] for every failed tool call in the window, newest first. Successful calls are not listed one by one.
      - name: "usage"
        type: array
        required: true
        description: >-
          [hour, session, agent, agent_type, model, effort, persona, requests, one value per counter, cost_usd, costed_requests], one row per distinct first seven fields over the requests tellem tokens counts. A counter or cost no request reported is null. Persona is the persona key, with unknown as null.
      - name: "gaps"
        type: array
        required: true
        description: >-
          [hour, repo, cause, harness, count] from gap records in the window.
      - name: "hooks"
        type: object
        required: true
        description: >-
          Keys 24h, 7d, and 30d, each [repo, harness, event, count, p50, p99, max] from raw hook_ms; repo null covers all, harness and event null is that repo's overall row. Rows exist only with samples.
      - name: "hook_gaps"
        type: array
        required: true
        description: >-
